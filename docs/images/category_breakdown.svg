<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="DM Sans, sans-serif">
  <rect width="900" height="480" fill="#fafaf8"/>

  <text x="450" y="32" text-anchor="middle" font-family="DM Serif Display, serif" font-size="20" fill="#1a1a2e">
    Success rate by scenario category
  </text>
  <text x="450" y="54" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" fill="#6b7280">
    The model learned the simplest pattern (unit conversion) first. Multi-step chains remained hard.
  </text>

  <text x="220" y="100" text-anchor="end" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Unit conversion</text>
<text x="220" y="114" text-anchor="end" font-family="DM Sans, sans-serif" font-size="10" fill="#6b7280" font-style="italic">1 scenario</text>
<rect x="240" y="80" width="490" height="36" fill="#e5e7eb" rx="4"/>
<rect x="240" y="80" width="428.8" height="36" fill="#2ea043" rx="4"/>
<text x="678.8" y="103" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#2ea043">87.5%</text>
<text x="220" y="150" text-anchor="end" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Single-tool weather</text>
<text x="220" y="164" text-anchor="end" font-family="DM Sans, sans-serif" font-size="10" fill="#6b7280" font-style="italic">5 scenarios</text>
<rect x="240" y="130" width="490" height="36" fill="#e5e7eb" rx="4"/>
<rect x="240" y="130" width="73.5" height="36" fill="#4285F4" rx="4"/>
<text x="323.5" y="153" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#4285F4">15.0%</text>
<text x="220" y="200" text-anchor="end" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Simple calculator</text>
<text x="220" y="214" text-anchor="end" font-family="DM Sans, sans-serif" font-size="10" fill="#6b7280" font-style="italic">6 scenarios</text>
<rect x="240" y="180" width="490" height="36" fill="#e5e7eb" rx="4"/>
<rect x="240" y="180" width="20.6" height="36" fill="#4285F4" rx="4"/>
<text x="270.6" y="203" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#4285F4">4.2%</text>
<text x="220" y="250" text-anchor="end" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Country lookup</text>
<text x="220" y="264" text-anchor="end" font-family="DM Sans, sans-serif" font-size="10" fill="#6b7280" font-style="italic">5 scenarios</text>
<rect x="240" y="230" width="490" height="36" fill="#e5e7eb" rx="4"/>
<rect x="240" y="230" width="36.8" height="36" fill="#4285F4" rx="4"/>
<text x="286.8" y="253" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#4285F4">7.5%</text>
<text x="220" y="300" text-anchor="end" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">2-step chains</text>
<text x="220" y="314" text-anchor="end" font-family="DM Sans, sans-serif" font-size="10" fill="#6b7280" font-style="italic">12 scenarios</text>
<rect x="240" y="280" width="490" height="36" fill="#e5e7eb" rx="4"/>
<rect x="240" y="280" width="14.7" height="36" fill="#d97706" rx="4"/>
<text x="264.7" y="303" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#d97706">3.0%</text>
<text x="220" y="350" text-anchor="end" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">3-step chains</text>
<text x="220" y="364" text-anchor="end" font-family="DM Sans, sans-serif" font-size="10" fill="#6b7280" font-style="italic">10 scenarios</text>
<rect x="240" y="330" width="490" height="36" fill="#e5e7eb" rx="4"/>
<rect x="240" y="330" width="6.4" height="36" fill="#d97706" rx="4"/>
<text x="256.4" y="353" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#d97706">1.3%</text>

  <!-- Legend — fully separated from bars with clear vertical margin -->
  <g transform="translate(220, 430)">
    <rect x="0" y="-10" width="16" height="16" fill="#2ea043" rx="3"/>
    <text x="24" y="4" font-size="12" fill="#374151" font-weight="500">Mastered (&gt;50%)</text>

    <rect x="160" y="-10" width="16" height="16" fill="#4285F4" rx="3"/>
    <text x="184" y="4" font-size="12" fill="#374151" font-weight="500">Partial (5-50%)</text>

    <rect x="310" y="-10" width="16" height="16" fill="#d97706" rx="3"/>
    <text x="334" y="4" font-size="12" fill="#374151" font-weight="500">Minimal (&lt;5%)</text>
  </g>
